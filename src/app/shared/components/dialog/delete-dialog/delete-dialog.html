<h2 mat-dialog-title>
  {{ data.title ?? 'Eliminar' }}
</h2>
<button matIconButton type="button" class="close-button" (click)="cancel()">
  <mat-icon>close</mat-icon>
</button>
<mat-divider></mat-divider>
<mat-dialog-content>
  <app-alert severity="warning">
    {{
      data.message ??
        '¿Estas seguro de que quieres realizar esta acción?, recuerda esta acción es irreversible.'
    }}
  </app-alert>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button
    type="button"
    matButton="filled"
    class="btn-error"
    [disabled]="loading()"
    (click)="cancel()"
  >
    {{ data.cancelText ?? 'Cancelar' }}
  </button>

  <button type="button" matButton="filled" [disabled]="loading()" (click)="confirm()">
    @if (loading()) {
      Eliminando...
    } @else {
      {{ data.confirmText ?? 'Aceptar' }}
    }
  </button>
</mat-dialog-actions>
