<h2 mat-dialog-title>{{ title() }}</h2>
<button
  matIconButton
  type="button"
  class="close-button"
  (click)="onClose($event)"
  [disabled]="isSubmitting()"
>
  <mat-icon>close</mat-icon>
</button>
<mat-divider></mat-divider>
<mat-dialog-content>
  @if (isLoading()) {
    <div class="loading-container">
      <mat-spinner diameter="50"></mat-spinner>
      <p>{{ loadingText() }}</p>
    </div>
  } @else {
    <ng-content></ng-content>
  }
</mat-dialog-content>
<mat-dialog-actions>
  <button
    type="button"
    matButton="filled"
    class="btn-error"
    (click)="cancel.emit()"
    [disabled]="isSubmitting()"
  >
    {{ cancelText() }}
  </button>
  <button
    type="button"
    matButton="filled"
    (click)="confirm.emit()"
    color="primary"
    [disabled]="isSubmitting() || isLoading() || isError()"
  >
    {{ confirmText() }}
  </button>
</mat-dialog-actions>
