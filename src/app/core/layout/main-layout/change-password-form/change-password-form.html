<app-form-dialog title="Cambiar contraseña" (confirm)="onSubmit()" (cancel)="onClose()">
  <form [formRoot]="changePasswordForm" (submit)="onSubmit()" autocomplete="off" class="form-flex">
    <app-form-input
      [formField]="changePasswordForm.currentPassword"
      label="Contraseña actual"
      type="password"
    />
    <app-form-input
      [formField]="changePasswordForm.newPassword"
      label="Nueva contraseña"
      type="password"
    />
    <app-form-input
      [formField]="changePasswordForm.confirmPassword"
      label="Confirmar nueva contraseña"
      type="password"
    />
  </form>
</app-form-dialog>
